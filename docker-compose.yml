version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: trademe_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: trademe
      MYSQL_USER: trademe_user
      MYSQL_PASSWORD: trademe_password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/Trademe.sql:/docker-entrypoint-initdb.d/Trademe.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - trademe_network

  backend:
    build: ./backend
    container_name: trademe_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: trademe_user
      DB_PASSWORD: trademe_password123
      DB_NAME: trademe
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-in-production
      JWT_ACCESS_TOKEN_MINUTES: 15
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - trademe_network

volumes:
  mysql_data:
    driver: local

networks:
  trademe_network:
    driver: bridge
